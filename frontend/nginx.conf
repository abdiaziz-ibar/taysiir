server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router (BrowserRouter): unknown paths fall back to index.html
    # instead of a 404, so a hard refresh on /parents/123 still works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets can be cached hard; index.html must not be, so a
    # new deploy is picked up on the next load instead of being stuck.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
