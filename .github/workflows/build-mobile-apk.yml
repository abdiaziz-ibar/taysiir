name: Build Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-mobile-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "18"

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install deps
        working-directory: mobile
        run: npm ci

      - name: Prebuild native Android project
        working-directory: mobile
        run: npx expo prebuild -p android --no-install

      - name: Build release APK (self-signed with debug key, for direct sideload)
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: taysir-foundation-mobile-apk
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
