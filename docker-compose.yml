services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: school_fee_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      # 5433 on the host: avoids clashing with a Postgres already running
      # locally on the default 5432. Containers still talk to each other
      # over 5432 on the internal compose network.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${DOCKERHUB_USER:-abdiazizhersifarah}/taysiir-backend:latest
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/school_fee_system?schema=public
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_EXPIRES_IN: 7d
      PORT: 5000
      NODE_ENV: production
      CLIENT_ORIGIN: http://localhost:8080
    ports:
      - "5000:5000"
    volumes:
      - uploads_data:/app/uploads

  frontend:
    image: ${DOCKERHUB_USER:-abdiazizhersifarah}/taysiir-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data:
